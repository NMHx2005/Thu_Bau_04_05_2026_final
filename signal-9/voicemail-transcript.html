<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGNAL LOST. Voicemail</title>
    <link rel="stylesheet" href="css/side-page.css" />
  </head>
  <body class="side-page side-page--phone">
    <div class="side-page__inner">
      <h1 class="side-page__title">Voicemail</h1>
      <p class="side-page__timestamp">March 2 — 0:18</p>
      <div class="side-page__body">
        <p>Hey.</p>
        <span class="pause">[pause]</span>
        <p>I know it's late. I wasn't going to leave this.</p>
        <span class="pause">[pause]</span>
        <p>I just needed you to know I heard you. Even when you didn't say the rest.</p>
        <span class="pause">[pause]</span>
        <p>Call me when you can. Or don't. I'll keep the line open either way.</p>
      </div>
      <button type="button" class="side-page__close" onclick="history.back()">Close</button>
    </div>
  </body>
</html>
