<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SIGNAL LOST. Prologue</title>
    <link rel="stylesheet" href="css/prologue.css" />
  </head>
  <body class="prologue-root" id="prologueRoot">
    <div id="audioUnlock" class="audio-unlock" role="dialog" aria-label="Enable sound">
      <p class="audio-unlock__title">SIGNAL LOST</p>
      <p class="audio-unlock__text">Tap to enable sound and begin.</p>
      <button type="button" class="audio-unlock__btn" id="btnAudioUnlock">Tap to start</button>
    </div>

    <section class="prologue-slide is-active" aria-label="Slide 1">
      <p class="prologue-text prologue-text--instant" id="prologueText">
        Dark. Then: a rectangle of light.
      </p>
    </section>
    <p class="prologue-hint prologue-hint--hidden" id="prologueHint">click anywhere to continue</p>

    <script src="js/state.js"></script>
    <script src="js/stateNight3Extend.js"></script>
    <script src="js/audio.js"></script>
    <script>
      (function () {
        var root = document.getElementById("prologueRoot");
        var audioReady = false;
        var unlockEl = document.getElementById("audioUnlock");
        var hintEl = document.getElementById("prologueHint");

        if (window.SignalLostState) {
          window.SignalLostState.resetGame();
        }

        function advance() {
          if (!audioReady) return;
          window.location.href = "prologue-2.html";
        }

        function enableAudio() {
          if (audioReady) return;
          audioReady = true;
          try {
            if (window.SignalLostAudio.markAudioUnlocked) {
              window.SignalLostAudio.markAudioUnlocked();
            } else {
              sessionStorage.setItem("signalLost_audioUnlocked", "1");
            }
          } catch (e) {}
          if (window.SignalLostAudio) {
            window.SignalLostAudio.resume();
            window.SignalLostAudio.startRainLoop();
          }
          if (unlockEl) unlockEl.classList.add("audio-unlock--done");
          if (hintEl) hintEl.classList.remove("prologue-hint--hidden");
        }

        document.getElementById("btnAudioUnlock").addEventListener("click", function (e) {
          e.stopPropagation();
          enableAudio();
        });

        unlockEl.addEventListener("click", function (e) {
          if (e.target === unlockEl || e.target.classList.contains("audio-unlock__text")) {
            enableAudio();
          }
        });

        root.addEventListener("click", function () {
          if (!audioReady) {
            enableAudio();
            return;
          }
          advance();
        });
      })();
    </script>
  </body>
</html>
