<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SIGNAL LOST. Waking up</title>
    <link rel="stylesheet" href="css/prologue.css" />
  </head>
  <body class="prologue-root" id="prologueRoot">
    <section class="prologue-slide is-active" data-slide="0" aria-label="Slide 1">
      <p class="prologue-text prologue-text--instant"></p>
    </section>
    <section class="prologue-slide" data-slide="1" aria-label="Slide 2">
      <p class="prologue-text"></p>
    </section>
    <section class="prologue-slide" data-slide="2" aria-label="Slide 3">
      <p class="prologue-text"></p>
    </section>
    <p class="prologue-hint">click anywhere to continue</p>
    <script src="js/audio.js"></script>
    <script>
      (function () {
        var slides = [
          "Your body knows something your mind does not yet. You are horizontal. The ceiling is unfamiliar.",
          "There is a sound. Rain, or something that wants to be rain. There is a phone. The screen is already on.",
          "You do not know how you came to be here.",
        ];
        var root = document.getElementById("prologueRoot");
        var sections = [].slice.call(document.querySelectorAll(".prologue-slide"));
        var idx = 0;

        try {
          if (
            sessionStorage.getItem("signalLost_audioUnlocked") === "1" &&
            window.SignalLostAudio
          ) {
            window.SignalLostAudio.resume();
            window.SignalLostAudio.startRainLoop();
          }
        } catch (e) {}

        function render() {
          sections.forEach(function (sec, i) {
            sec.classList.toggle("is-active", i === idx);
            var p = sec.querySelector(".prologue-text");
            p.textContent = slides[i];
            p.classList.remove("prologue-text--fade", "prologue-text--instant");
            if (i === idx && i === 0) {
              p.classList.add("prologue-text--instant");
            } else if (i === idx && i > 0) {
              void p.offsetWidth;
              p.classList.add("prologue-text--fade");
            }
          });
        }

        function advance() {
          if (idx >= sections.length - 1) {
            window.location.href = "night0.html";
            return;
          }
          idx++;
          render();
        }

        root.addEventListener("click", advance);
        render();
      })();
    </script>
  </body>
</html>
